<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AR Makeup Try-On</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h2 {
      margin: 10px 0;
    }

    #camera-container {
      width: 100%;
      height: 75vh;
      background: black;
    }

    #controls {
      padding: 10px;
    }

    button {
      margin: 5px;
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      background: #ff4aa1;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>AR Makeup Try-On</h2>

  <div id="camera-container"></div>

  <div id="controls">
    <button onclick="switchLens('Hot Pink Glam')">Hot Pink Glam</button>
    <button onclick="switchLens('Eyeliner Switch')">Eyeliner</button>
    <button onclick="switchLens('Shadow Switch')">Shadow</button>
    <button onclick="switchLens('Blush Parade')">Blush</button>
    <button onclick="switchLens('Lipstick Parade')">Lipstick</button>
  </div>

  <!-- Snap Camera Kit SDK -->
  <script src="https://sdk.snapkit.com/js/v1"></script>
  <script src="main.js"></script>

</body>
</html>
